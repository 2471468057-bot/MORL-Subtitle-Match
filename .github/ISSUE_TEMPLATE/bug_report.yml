name: Bug report
description: Report a reproducible 2ByteASR problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, private media paths, recognized private text, voiceprints, and personal data before posting.
  - type: input
    id: version
    attributes:
      label: 2ByteASR version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and GPU
      placeholder: "Windows 11 24H2, RTX 5070 Ti 16 GB, driver 000.00"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that consistently triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Do not attach private audio or unredacted reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private data from this report.
          required: true
