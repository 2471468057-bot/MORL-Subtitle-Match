name: build-release-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version, for example 0.1.0"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Test public source
        run: |
          python -m pip install pytest==9.1.1 pypinyin==0.55.0 requests==2.33.0 jieba==0.42.1
          python -m pytest -q tests
          python scripts/check_release_hygiene.py

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.3 --no-progress -y

      - name: Build installer and checksum
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .\scripts\build_installer.ps1 -Version $env:INSTALLER_VERSION
          $installer = "dist\2ByteASR-Setup-$env:INSTALLER_VERSION.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  2ByteASR-Setup-$env:INSTALLER_VERSION.exe" | Set-Content -Encoding ascii "$installer.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 2ByteASR-Setup-${{ steps.version.outputs.value }}
          path: |
            dist/2ByteASR-Setup-${{ steps.version.outputs.value }}.exe
            dist/2ByteASR-Setup-${{ steps.version.outputs.value }}.exe.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 2ByteASR-Setup-${{ needs.windows-installer.outputs.version }}
          path: dist

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          INSTALLER_VERSION: ${{ needs.windows-installer.outputs.version }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG `
            "dist\2ByteASR-Setup-$env:INSTALLER_VERSION.exe" `
            "dist\2ByteASR-Setup-$env:INSTALLER_VERSION.exe.sha256" `
            --verify-tag --generate-notes --title "2ByteASR $env:RELEASE_TAG"
